site_name: HMPL
repo_url: https://github.com/ezz-ae/HMPL
repo_name: ezz-ae/HMPL

docs_dir: .
site_dir: site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - toc.follow

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight

nav:
  - Home: README.md
  - Law:
      - HMPL v1.0: law/HMPL_v1.0.md
  - Whitepapers:
      - Whitepaper v1.1: whitepapers/HMPL_Whitepaper_v1.1.md
  - Journals:
      - arXiv Draft: journals/HMPL_arXiv_Submission.md
      - JOLT Adaptation Note: journals/HMPL_JOLT_Adaptation_Note.md
  - Regulators:
      - Regulator Paragraph: regulators/HMPL_Regulator_Paragraph.md
      - Diagram Caption: regulators/HMPL_Diagram_Caption.md
      - Pharma Factory Analogy: regulators/HMPL_Analogy_PharmaFactory.md
  - Governance:
      - Authority Classes: governance/Authority_Classes.md
      - H-Ledger Model: governance/H_Ledger_Model.md
      - Precedent→Policy Pipeline: governance/Precedent_to_Policy_Pipeline.md
  - CXL:
      - Specification: cxl/CXL_Specification.md
      - Grammar: cxl/CXL_Grammar.ebnf
  - Schemas:
      - E-PKT Schema: schemas/E-PKT.schema.json
      - Common Hardening Schema: schemas/common_hardening.schema.json
  - Implementation:
      - Reference Architecture: implementation/reference_architecture.md
      - Runtime Skeleton: implementation/runtime/hmpl-repo-skeleton/README.md
